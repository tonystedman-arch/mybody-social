name: Rebuild media

# Whenever the copy or the reel spec changes, regenerate every end card, Reel
# and cover frame and commit the result. So editing a hook is the whole job —
# nobody has to remember to re-render anything by hand.

on:
  push:
    paths:
      - "build/reels.json"
      - "build/render-pro-launch-v2.py"
      - "build/render-social-assets.py"
      - "build/build_reels.py"
      - "build/raw/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow and ffmpeg
        run: |
          python -m pip install --quiet pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Rebuild every asset
        run: ./build/build-all.sh

      - name: Commit the rebuilt media
        run: |
          if [ -n "$(git status --porcelain media)" ]; then
            git config user.name  "my-body-bot"
            git config user.email "bot@mybodyoptimise.com"
            git add media
            git commit -m "media: rebuilt from source"
            git push
          else
            echo "Media unchanged."
          fi
