name: Rebuild media

# Whenever the copy or the reel spec changes, regenerate every end card, Reel
# and cover frame and commit the result. So editing a hook is the whole job —
# nobody has to remember to re-render anything by hand.

on:
  push:
    paths:
      - "build/**"              # any build source, spec or raw capture
      - ".github/workflows/render-media.yml"
  workflow_dispatch:

# The paths list used to name five files individually, which meant edits to
# build_music.py, build_receipt.py, build-all.sh or this workflow itself
# changed nothing and silently produced no run — easily mistaken for a
# failure. "build/**" covers every source; listing this file means a fix to
# the CI recipe re-runs and proves itself.

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # numpy is not optional: build_music.py synthesises the heartbeat track
      # with it, and build_reels.py imports build_music at module load, so a
      # missing numpy fails the whole reel step even though the end cards
      # (Pillow only) render fine. Run #2 died exactly there on 10 Aug 2026.
      - name: Install Pillow, numpy and ffmpeg
        run: |
          python -m pip install --quiet pillow numpy
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Invoked through bash rather than as ./build/build-all.sh. The repo is
      # pushed from Windows, where git does not record the executable bit, so
      # the script lands in CI as mode 100644 and running it directly fails
      # with exit code 126 ("cannot execute"). Calling bash explicitly makes
      # the file mode irrelevant. Run #1 failed exactly this way on 10 Aug 2026.
      - name: Rebuild every asset
        run: bash build/build-all.sh

      - name: Commit the rebuilt media
        run: |
          if [ -n "$(git status --porcelain media)" ]; then
            git config user.name  "my-body-bot"
            git config user.email "bot@mybodyoptimise.com"
            git add media
            git commit -m "media: rebuilt from source"
            git push
          else
            echo "Media unchanged."
          fi
