name: Daily Instagram post

# Publishes the next post in the campaign at 08:00 UK. Reads launch-status.txt
# so a post that names a price cannot go out before the subscriptions are
# approved. Commits posted.log back, which is how sequence position survives
# between runs.

# ─────────────────────────────────────────────────────────────────────────
# PAUSED 15 August 2026. The daily schedule is commented out deliberately —
# not broken, not abandoned.
#
# Why: every post in this repo sells "three apps, one account." The 14 Aug
# decision (docs/product/My Body 3.0 - Build Plan) collapses the three apps
# into one, so that sentence is now false. The Growth Rethink of the same
# date already called for brand posting to stop; this is that decision
# reaching the machine.
#
# Note for whoever restarts this: setting launch-status.txt to pre_pro does
# NOT stop publishing. It only holds posts marked `requires: pro_live`. The
# four posts in the holding queue are `requires: none` and would keep
# rotating — and all four carry the three-app copy. Disabling the cron is
# the only switch that actually stops the account.
#
# workflow_dispatch is left enabled, so a single post can still be fired by
# hand if needed.
#
# To restart: uncomment the two schedule lines below, and only after the
# captions have been rewritten for the merged app.
# See marketing/content/My Body - Marketing Reconciliation to 3.0 (Aug 2026).md
# ─────────────────────────────────────────────────────────────────────────

on:
  # schedule:
  #   - cron: "0 7 * * *"        # 07:00 UTC ≈ 08:00 UK during BST
  workflow_dispatch:
    inputs:
      post_id:
        description: "Publish one specific post id (e.g. d04-overlay). Blank = next in sequence."
        required: false
        default: ""
      dry_run:
        description: "Dry run — log the API calls, publish nothing"
        type: boolean
        required: false
        default: false

permissions:
  contents: write               # needed to commit posted.log

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read the launch-status gate
        id: gate
        run: |
          STATUS=$(grep -v '^[[:space:]]*#' launch-status.txt | grep -v '^[[:space:]]*$' | head -1 | tr -d '[:space:]')
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Launch status: $STATUS"

      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_VERSION: v21.0
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/media
          LAUNCH_STATUS: ${{ steps.gate.outputs.status }}
          DEFAULT_AUDIO_NAME: "optimise. — original audio"
          POST_ID_OVERRIDE: ${{ github.event.inputs.post_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node post.js

      - name: Record what went out
        if: github.event.inputs.dry_run != 'true'
        run: |
          if [ -n "$(git status --porcelain posted.log)" ]; then
            git config user.name  "my-body-bot"
            git config user.email "bot@mybodyoptimise.com"
            git add posted.log
            git commit -m "posted: $(tail -1 posted.log | cut -f2)"
            git push
          else
            echo "Nothing published, nothing to record."
          fi
